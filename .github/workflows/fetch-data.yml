name: Fetch Daily Match Data

on:
  schedule:
    # Vremena su u UTC.
    - cron: '0 3 * * *' # U 03:00 UTC: ažuriraj jučerašnje konačne rezultate (FT)
    - cron: '0 6 * * *' # U 06:00 UTC: dohvati današnju i sutrašnju ponudu
  workflow_dispatch:
    inputs:
      date:
        description: 'Datum (YYYY-MM-DD, opcionalno - prazno za danas i sutra)'
        required: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and calculate AI match probabilities
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            FETCH_DATE="${{ github.event.inputs.date }}" node scripts/fetch-matches.mjs
          else
            SCHEDULE_HOUR=$(date -u +'%H')
            if [[ "$SCHEDULE_HOUR" == "03" ]]; then
              YESTERDAY=$(date -u -d "-1 days" +'%Y-%m-%d')
              UPDATE_SCORES_ONLY=true FETCH_DATE="$YESTERDAY" node scripts/fetch-matches.mjs
            else
              TODAY=$(date -u +'%Y-%m-%d')
              TOMORROW=$(date -u -d "+1 days" +'%Y-%m-%d')
              FETCH_DATE="$TODAY" node scripts/fetch-matches.mjs
              FETCH_DATE="$TOMORROW" node scripts/fetch-matches.mjs
            fi
          fi

      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add public/data/

          if ! git diff --staged --quiet; then
            git commit -m "chore: Update match data and AI probabilities"
            git push
          else
            echo "No changes to commit."
          fi